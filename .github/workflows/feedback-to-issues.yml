name: Feedback to issues

# Files new player feedback from the Discord "Feedback & Support" panel
# (Supabase public.feedback) as GitHub issues labelled needs-triage, so every
# Claude session can read it. Issues carry the text only, no Discord identity.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Preview only (file nothing)'
        type: boolean
        default: false
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  issues: write

jobs:
  file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Make sure the labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create needs-triage --color ededed --description "Not looked at yet" 2>/dev/null || true
          gh label create player-bug --color e74c3c --description "Bug report from a player" 2>/dev/null || true
          gh label create player-feedback --color 3498db --description "Feedback or idea from a player" 2>/dev/null || true
          gh label create player-question --color f1c40f --description "Question from a player" 2>/dev/null || true
      - name: File feedback
        working-directory: packages/core
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run feedback -- ${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && '--dry' || '' }}
