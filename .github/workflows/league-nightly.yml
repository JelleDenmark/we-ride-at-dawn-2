name: League nightly round

# Scores the nightly league (packages/core/scripts/run-league-round.ts).
# The schedule below is a fallback: GitHub cron can run late or skip. Triggering
# workflow_dispatch from Supabase pg_cron is more reliable (SQL at the end of
# supabase/migrations/2026-11-03-league.sql). A second run for a closed round
# is a no-op, so having both is safe.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Preview only (score, write and post nothing)'
        type: boolean
        default: false
  schedule:
    - cron: '40 20 * * *'

jobs:
  round:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run nightly round
        working-directory: packages/core
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: npm run league:round -- ${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && '--dry' || '' }}
