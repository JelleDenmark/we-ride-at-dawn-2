name: CI

# Core tests on every push and pull request. Separate from the Pages deploy on
# purpose: a red test shows here without blocking a deploy.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test -w @wrad/core
