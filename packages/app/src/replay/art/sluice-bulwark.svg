<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Sluice-Bulwark: hulking drain guard behind a rusted sluice-gate shield -->
  <!-- stocky legs -->
  <rect x="17" y="48" width="8" height="12" rx="2" fill="#4a5563" stroke="#1a222b" stroke-width="1.2"/>
  <rect x="27" y="48" width="8" height="12" rx="2" fill="#33414f" stroke="#1a222b" stroke-width="1.2"/>
  <!-- broad body -->
  <path d="M12 26 C12 19 36 19 37 26 L39 49 C39 52 10 52 10 49 Z" fill="#4a5563" stroke="#1a222b" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M13 36 L37 36" stroke="#33414f" stroke-width="1.4"/>
  <!-- head under a riveted pot helm -->
  <path d="M15 19 C15 9 33 9 33 19 L33 22 L15 22 Z" fill="#5f7288" stroke="#1a222b" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="15" y="18" width="18" height="2.4" fill="#1a222b"/>
  <circle cx="18" cy="14" r="0.9" fill="#1a222b"/>
  <circle cx="24" cy="12" r="0.9" fill="#1a222b"/>
  <circle cx="30" cy="14" r="0.9" fill="#1a222b"/>
  <!-- sluice-gate shield: rusted plate on rails, held forward -->
  <rect x="34" y="16" width="3" height="42" rx="1" fill="#33414f" stroke="#1a222b" stroke-width="1"/>
  <rect x="57" y="16" width="3" height="42" rx="1" fill="#33414f" stroke="#1a222b" stroke-width="1"/>
  <rect x="36" y="20" width="22" height="34" rx="1.5" fill="#8a5a3a" stroke="#1a222b" stroke-width="1.6"/>
  <path d="M36 28 L58 28 M36 37 L58 37 M36 46 L58 46" stroke="#5e3b24" stroke-width="1.6"/>
  <path d="M40 24 Q44 33 41 42" stroke="#a8714a" stroke-width="1.2" fill="none"/>
  <circle cx="39" cy="23" r="1" fill="#2a1a10"/>
  <circle cx="55" cy="23" r="1" fill="#2a1a10"/>
  <circle cx="39" cy="51" r="1" fill="#2a1a10"/>
  <circle cx="55" cy="51" r="1" fill="#2a1a10"/>
  <!-- water seeping under the gate -->
  <path d="M37 56 Q41 54 45 56 T53 56 T59 56" stroke="#4f7f86" stroke-width="1.6" fill="none"/>
  <!-- gauntlet gripping the gate -->
  <rect x="31" y="32" width="7" height="6" rx="2" fill="#5f7288" stroke="#1a222b" stroke-width="1"/>
</svg>
