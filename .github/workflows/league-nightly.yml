name: League nightly round

# Scores the nightly league (packages/core/scripts/run-league-round.ts).
# GitHub cron is UTC and can run late or skip, so it fires four times; a
# scheduled run only scores between 21:30 and midnight Copenhagen time (which
# covers both winter and summer time), and a second run for a closed round is a
# no-op. Manual dispatch always runs.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Preview only (score, write and post nothing)'
        type: boolean
        default: false
  schedule:
    - cron: '35 19 * * *'
    - cron: '50 19 * * *'
    - cron: '35 20 * * *'
    - cron: '50 20 * * *'

jobs:
  round:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run nightly round
        working-directory: packages/core
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: npm run league:round -- ${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && '--dry' || '' }} ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
